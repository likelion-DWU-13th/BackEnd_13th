{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TimeLetter - Posts</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="icon" href="{% static 'assets/favicon.ico' %}">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,400,700,900" rel="stylesheet">
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">TimeLetter</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="pt-5 mt-5">
        <div class="container py-5">
            <h1 class="text-center mb-4">나의 타임레터</h1>

            <!-- Post Preview Card -->
            <div class="card mb-4 shadow-sm border-0">
                <div class="card-body">
                    <h4 class="card-title fw-bold">예시 제목</h4>
                    <p class="card-text text-muted small">2025년 5월 8일 작성</p>
                    <p class="card-text">이곳은 게시글의 간단한 내용 미리보기입니다. 나중에는 실제 작성된 내용을 일부 불러와서 보여줄 수 있습니다. 사진 없이 텍스트에 집중할 수 있는 구조입니다.</p>
                    <a href="#" class="btn btn-outline-primary btn-sm">자세히 보기</a>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer bg-light text-center text-muted py-3">
        <div class="container">© TimeLetter 2025</div>
    </footer>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
