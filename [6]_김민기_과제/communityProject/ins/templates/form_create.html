<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f7f9fc;
        color: #333;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
  
      .container {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
      }
  
      h1 {
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
      }
  
      table {
        width: 100%;
        border-spacing: 0.5rem;
      }
  
      input[type="text"],
      textarea,
      input[type="file"] {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
      }
  
      input[type="submit"] {
        margin-top: 1rem;
        width: 100%;
        background-color: #0056b3;
        color: white;
        border: none;
        padding: 0.75rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
      }
  
      input[type="submit"]:hover {
        background-color: #0056b3;
      }
    </style>
</head>
<body>

    <h1>포트폴리오에 조언이나 응원 남겨주기</h1>
    <form action="" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <table>
        {{ form.as_table }} 
      </table>
      <input type="submit" value="조언 및 응원 남기기" />
    </form>
    
</body>
</html>
