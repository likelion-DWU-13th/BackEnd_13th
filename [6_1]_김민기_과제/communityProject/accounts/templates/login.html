<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .user {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #007bff; /* 파란색 */
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff; /* 파란색 */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3; /* 어두운 파란색 */
        }
        hr {
            margin: 20px 0;
        }
        a {
            display: block;
            text-align: center;
            padding: 10px;
            background-color: #266c49ca; /* 구글 로그인 색상 */
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 10px;
        }
        a:hover {
            background-color: #c1351d; /* 구글 로그인 Hover 색상 */
        }
    </style>
</head>
{% load socialaccount %}
<body>
    <h1>Login</h1>
    {% if error_message %} 
        <p style="color: red;">{{ error_message }}</p>  
    {% endif %}
    <form class="user" method="POST">
        {% csrf_token %}
        <div>
            <input type="text" name="username" placeholder="ID">
        </div>
        <div>
            <input type="password" name="password" placeholder="PassWord"> 
        </div>
        <input type="submit" value="Login">
        <hr/>
        <a href="{% provider_login_url 'google' %}">
            <i>Google Login</i>
        </a>
    </form>

</body>
</html>
