{% load socialaccount %}
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | MusicLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
            <h2 class="text-center mb-4 text-dark">🎵 MusicLog 로그인</h2>

            {% if error_message %}
            <div class="alert alert-danger text-center" role="alert">
                {{ error_message }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="아이디를 입력해주세요" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="비밀번호를 입력해주세요" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">로그인</button>
            </form>

            <hr class="my-4">

            <a href="{% provider_login_url 'google' %}" class="btn btn-outline-danger w-100">
                <i class="bi bi-google"></i> Google로 로그인
            </a>

            <p class="mt-3 mb-0 text-center text-dark">
                아직 회원이 아니신가요? <a href="{% url 'accounts:signup' %}">회원가입</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
