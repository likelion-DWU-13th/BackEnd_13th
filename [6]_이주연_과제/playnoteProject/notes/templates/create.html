{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 작성하기 - 치이카와포켓</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <ul class="menu">
            <li><a href="{% url 'home' %}">홈</a></li>
            <li><a href="{%url 'list' %}">정보 모음</a></li>
            {% if user.is_authenticated %} 
            <li><a href="{%url 'accounts:logout' %}" class="logout">로그아웃</a></li>
            {% else %}
            <li><a href="{%url 'accounts:login' %}" class="login">로그인</a></li> 
            {% endif %}
            {% if user.is_authenticated %}
            <li><a href="{%url 'accounts:profile' %}" class="profile-link">{{ user.username }}님</a></li>
            {% endif %}
        </ul>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2 style="text-align: center; color: #f7ce00;" class="post-title">정보공유 글 작성</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label for="title">제목</label>
                    {{ form.title }}
                </div>
                <div class="form-group">
                    <label for="content">내용</label>
                    {{ form.content }}
                </div>
                <div class="form-group">
                    <label for="image">이미지 첨부</label>
                    {{ form.image }}
                </div>
                <div style="text-align: center;">
                    <button type="submit" class="btn yellow-btn">게시하기</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
