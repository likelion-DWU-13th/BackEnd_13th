{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 치이카와포켓</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar signup-navbar">
        <ul>
            <li><a href="{% url 'home' %}">홈</a></li>
            <li><a href="{% url 'list' %}">정보 모음</a></li>
        </ul>
    </nav>
    <div class="signup-container">
        <h2 style="color:#7eb6db; margin-bottom:1.5rem;">회원가입</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="repeat">비밀번호 확인</label>
                <input type="password" id="repeat" name="repeat" class="form-input" required>
            </div>
            <button type="submit" class="signup-btn">회원가입</button>
        </form>
        <div style="margin-top:1.5rem;">
            <a href="{% url 'accounts:login' %}" class="signup-link">소셜로그인으로 간편하게 가입하기</a>
        </div>
        <div style="margin-top:1.5rem;">
            <a href="{% url 'accounts:login' %}" class="signup-link">이미 계정이 있으신가요? 로그인</a>
        </div>
    </div>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
